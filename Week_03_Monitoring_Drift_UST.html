<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Week 3 Participant View — Agentic AI, HITL, Drift &amp; Git Worktrees</title>
<style>
  :root {
    --bg: #070d1a;
    --card: #0f172a;
    --card2: #16223b;
    --border: #233554;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --cyan: #38bdf8;
    --teal: #2dd4bf;
    --amber: #fbbf24;
    --rose: #f87171;
    --violet: #a78bfa;
    --green: #34d399;
    --pink: #f472b6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    padding: 1.5rem;
  }
  .container { max-width: 1220px; margin: 0 auto; }
  .hero {
    background: linear-gradient(135deg, #0f172a 0%, #172546 100%);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 1.75rem 2rem;
    position: relative;
    overflow: hidden;
    margin-bottom: 1.25rem;
  }
  .hero::after {
    content: "";
    position: absolute;
    right: -60px; top: -60px;
    width: 240px; height: 240px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(52,211,153,0.2), transparent 70%);
    animation: pulse 4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{transform:scale(1);opacity:.6} 50%{transform:scale(1.25);opacity:1} }
  .badge {
    display: inline-block;
    padding: 0.22rem 0.7rem;
    border-radius: 999px;
    font-size: 0.74rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    background: rgba(52,211,153,0.14);
    color: var(--green);
    border: 1px solid rgba(52,211,153,0.35);
  }
  h1 { margin: 0.5rem 0 0.25rem; font-size: 1.85rem; color: #fff; }
  h2 { margin: 0 0 0.75rem; font-size: 1.25rem; color: #fff; }
  h3 { margin: 0 0 0.5rem; font-size: 1.05rem; color: var(--cyan); }
  .sub { color: var(--muted); font-size: 0.94rem; margin: 0; }

  .nav-tabs { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-bottom: 1.25rem; }
  .nav-tabs button {
    background: var(--card);
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 0.55rem 0.9rem;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.82rem;
    transition: all 0.2s ease;
  }
  .nav-tabs button:hover { color: #fff; border-color: var(--cyan); }
  .nav-tabs button.active {
    background: linear-gradient(135deg, #059669, #0284c7);
    color: #fff;
    border-color: var(--teal);
    box-shadow: 0 0 16px rgba(45,212,191,0.25);
  }

  .panel { display: none; animation: fadeIn 0.3s ease; }
  .panel.active { display: block; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

  .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
  .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
  .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0.9rem; margin-bottom: 1rem; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.2rem;
  }
  .card-top-green { border-top: 3px solid var(--green); }
  .card-top-cyan { border-top: 3px solid var(--cyan); }
  .card-top-violet { border-top: 3px solid var(--violet); }
  .card-top-amber { border-top: 3px solid var(--amber); }
  .card-top-pink { border-top: 3px solid var(--pink); }

  .flow-box {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem;
    margin-top: 0.75rem;
  }
  .sim-btn {
    background: var(--card2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 0.45rem 0.85rem;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 600;
    margin: 0.25rem 0.35rem 0.25rem 0;
  }
  .sim-btn:hover, .sim-btn.active { border-color: var(--amber); color: var(--amber); }
  .btn-run {
    background: #059669; color: #fff; border: none; padding: 0.5rem 1rem;
    border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 0.82rem;
  }
  .btn-run:hover { background: #10b981; }

  .pill {
    display: inline-block; font-size: 0.72rem; padding: 0.15rem 0.5rem; border-radius: 6px;
    background: #0b1324; border: 1px solid var(--border); color: var(--teal); font-weight: 600;
  }
  .pill-oss { background: rgba(52,211,153,0.12); color: var(--green); border: 1px solid rgba(52,211,153,0.35); }
  .pill-com { background: rgba(167,139,250,0.14); color: var(--violet); border: 1px solid rgba(167,139,250,0.35); }
  .pill-prod { background: rgba(251,191,36,0.16); color: var(--amber); border: 1px solid rgba(251,191,36,0.45); font-weight: 700; }

  .dash-anim { stroke-dasharray: 8 6; animation: dash 1.2s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -28; } }
  .node-active { border-color: var(--green) !important; box-shadow: 0 0 18px rgba(52,211,153,0.45); transform: scale(1.03); }

  .meter { height: 14px; background: #0b1324; border-radius: 999px; overflow: hidden; border: 1px solid var(--border); margin: 0.5rem 0; }
  .meter-fill { height: 100%; transition: width 0.35s ease, background 0.35s ease; }
  code { background: #091122; padding: 0.15rem 0.4rem; border-radius: 5px; color: var(--teal); font-size: 0.84em; }
  table { width: 100%; border-collapse: collapse; font-size: 0.84rem; margin-top: 0.5rem; }
  th, td { text-align: left; padding: 0.6rem 0.7rem; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--cyan); background: var(--card2); }
</style>
<style>
  html, body, * {
    -webkit-user-select: none !important;
    -moz-user-select: none !important;
    -ms-user-select: none !important;
    user-select: none !important;
    -webkit-touch-callout: none !important;
  }
  @media print {
    body * { display: none !important; }
    body::after {
      content: "Printing and exporting are disabled for this participant material.";
      display: block; padding: 3rem; font-size: 1.2rem; color: #000; text-align: center;
    }
  }
  #sec-lock {
    display: none; position: fixed; inset: 0; z-index: 99999;
    background: rgba(7, 13, 26, 0.97); color: #f87171;
    align-items: center; justify-content: center; text-align: center; padding: 2rem;
    font-family: system-ui, sans-serif;
  }
</style>
</head>

  // Block keyboard shortcuts for DevTools, View Source, Save, Print, Copy, Select All
  document.addEventListener('keydown', function(e) {
    const k = (e.key || '').toLowerCase();
    const ctrl = e.ctrlKey || e.metaKey;
    if (
      e.keyCode === 123 || // F12
      (ctrl && e.shiftKey && ['i', 'j', 'c', 'k'].includes(k)) ||
      (ctrl && ['u', 's', 'p', 'c', 'x', 'a'].includes(k))
    ) {
      e.preventDefault();
      e.stopPropagation();
      return false;
    }
  }, true);

    document.addEventListener(evt, function(e) { e.preventDefault(); return false; }, true);

      root.style.filter = 'blur(16px)';

      lock.style.display = 'none';
